name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install system libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 desktop-file-utils appstream
      - name: Install dependencies
        run: uv sync --locked --extra gui
      - name: Ruff check
        run: uv run ruff check --output-format=github
      - name: Ruff format
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Translations are up to date
        run: uv run python -m freestep.gui.po check
      - name: Flatpak sources are up to date
        run: uv run python packaging/flatpak/generate_sources.py --check
      - name: Validate desktop file
        run: desktop-file-validate packaging/linux/*.desktop
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/linux/*.metainfo.xml

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install system libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: uv sync --locked --extra gui
      - name: Pytest
        # The integration tests need the (private) sample export and are skipped here.
        run: uv run pytest -v
