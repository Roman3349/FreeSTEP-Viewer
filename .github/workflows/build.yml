name: Build packages

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ID: cz.romanondracek.FreeStepViewer

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra gui --no-dev
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Render icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync --with pillow python packaging/make_icons.py build/icons
      - name: PyInstaller
        run: uv run --no-sync --with pyinstaller pyinstaller --noconfirm --distpath dist --workpath build/pyinstaller packaging/pyinstaller/freestep.spec
      - name: Smoke test
        run: dist\FreeStepViewer\freestep.exe --help
      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} packaging\windows\installer.iss
      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\FreeStepViewer -DestinationPath dist\FreeStepViewer-${{ steps.version.outputs.version }}-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra gui --no-dev
      - name: Read version
        id: version
        run: echo "version=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Render icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync python packaging/make_icons.py build/icons
      - name: PyInstaller
        run: uv run --no-sync --with pyinstaller pyinstaller --noconfirm --distpath dist --workpath build/pyinstaller packaging/pyinstaller/freestep.spec
      - name: Smoke test
        run: '"dist/FreeSTEP Viewer.app/Contents/MacOS/freestep" --help'
      - name: Disk image
        run: |
          # Unsigned: without an Apple Developer ID the app cannot be signed and notarized,
          # so ad-hoc sign it (required on Apple Silicon) and let users allow it on first start.
          codesign --force --deep --sign - "dist/FreeSTEP Viewer.app"
          mkdir -p dist/dmg
          cp -R "dist/FreeSTEP Viewer.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "FreeSTEP Viewer" -srcfolder dist/dmg -ov -format UDZO \
            "dist/FreeStepViewer-${{ steps.version.outputs.version }}-macos-$(uname -m).dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install flatpak-builder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
      - name: Add Flathub
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: >-
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean
          --repo=repo build-flatpak packaging/flatpak/${APP_ID}.yml
      - name: Bundle
        run: >-
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          repo FreeStepViewer-${{ matrix.arch }}.flatpak ${APP_ID}
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: FreeStepViewer-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the project version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
