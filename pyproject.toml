[project]
name = "freestep"
version = "0.2.1"
description = "Parser of data exported from the FreeSTEP pressure-plate software"
readme = "README.md"
authors = [
    { name = "Roman Ondráček", email = "mail@romanondracek.cz" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "access-parser>=0.0.6",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.urls]
Homepage = "https://github.com/Roman3349/FreeSTEP-Viewer"
Repository = "https://github.com/Roman3349/FreeSTEP-Viewer"
Issues = "https://github.com/Roman3349/FreeSTEP-Viewer/issues"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6", "PySide6-Addons>=6.6"]

[project.scripts]
freestep = "freestep.cli:main"

[project.gui-scripts]
freestep-viewer = "freestep.gui.app:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.17.4",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "D"]
# RUF001-003: Czech/Italian text and typographic characters in strings and comments are intended
ignore = ["PLR2004", "PLR0913", "PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "packaging"]

[[tool.mypy.overrides]]
module = ["access_parser.*", "PIL.*"]
ignore_missing_imports = true
